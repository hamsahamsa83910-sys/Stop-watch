{% extends 'store/base.html' %}
{% load static %}

{% block title %}Create Account | AetherStore{% endblock %}

{% block content %}
    <div class="form-card glass-panel" id="register-container">
        <div class="form-header">
            <h2>Join AetherStore</h2>
            <p>Create a membership account for express checkouts and history tracking</p>
        </div>

        <form action="{% url 'store:register' %}" method="POST" id="register-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username" class="form-label">Username *</label>
                <input type="text" name="username" id="username" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" name="email" id="email" class="form-input" placeholder="yourname@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password *</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 32px"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="{% url 'store:login' %}">Sign In</a>
        </div>
    </div>
{% endblock %}
