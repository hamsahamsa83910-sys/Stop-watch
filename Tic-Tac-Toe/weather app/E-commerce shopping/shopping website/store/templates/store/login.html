{% extends 'store/base.html' %}
{% load static %}

{% block title %}Sign In | AetherStore{% endblock %}

{% block content %}
    <div class="form-card glass-panel" id="login-container">
        <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your account dashboard</p>
        </div>

        <form action="{% url 'store:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" method="POST" id="login-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-input" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 32px"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        </form>

        <div class="form-footer">
            Don't have an account yet? <a href="{% url 'store:register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Create Account</a>
        </div>
    </div>
{% endblock %}
